name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    # M14-35 R1：vitest 进入 PR 门禁（根 package.json 的 test 指向 pytest，
    # 必须 --workspace apps/web 才跑 web 的 vitest）
    name: Web (test / typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace apps/web
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  api:
    name: API (ruff / pytest / migration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          # M10-04 返工：CI service 是一次性容器，也统一用隔离测试库名——
          # pytest 安全门控只放行 ai_learning_os_test 等隔离名，主/共享库
          # 名 ai_learning_os 会被自动跳过（本地与 CI 同一规则）。
          POSTGRES_DB: ai_learning_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d ai_learning_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIOS_PG_TEST_URL: postgresql+asyncpg://aios:aios@localhost:5432/ai_learning_os_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - name: Ruff
        run: ruff check services/api
      - name: Pytest (unit + SQLite stand-in + real PG integration)
        # M8-00: DATABASE_URL 只属于 migration 步骤 —— pytest 必须验证「无 DB 503」
        # 语义，job 级 DATABASE_URL 会污染 26 个无 DB 断言（CI 失败根因）
        env:
          DATABASE_URL: ""
        run: python -m pytest services/api
      - name: Migration check (upgrade - downgrade base - upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://aios:aios@localhost:5432/ai_learning_os_test
        run: |
          cd services/api
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    name: Docker (compose build + healthy + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the full stack
        # M8-00: 真实构建启动门禁 —— compose config 渲染不等于可运行
        run: docker compose -f infra/docker-compose.yml --profile local up -d --build
      - name: Smoke (healthy + endpoints + upload survives api restart)
        run: bash infra/smoke_docker.sh
      - name: Dump api logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200 api web

  android:
    name: Android (unit test / lint / assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        # M12-01: gradlew 不带可执行位入库存放（Windows 工作区无法稳定提交 exec bit），
        # 统一经 sh 调用，跨平台等价，不需要 chmod +x
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Unit tests + lint + assemble (debug)
        run: sh ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

  release-tools:
    name: Release tools (Python tests)
    # M13-12: 仅验证 tools/harmony_release 的 Python fail-closed 签名前置
    # 检查逻辑(compileall + pytest)。这不是 HarmonyOS 构建/设备/签名/运行时
    # 验证 job —— 不安装 API 依赖、Android/DevEco SDK、证书或签名材料。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pytest only
        run: pip install "pytest>=9,<10"
      - name: Byte-compile tools/harmony_release
        run: python -m compileall tools/harmony_release
      - name: Pytest tests/harmony_release
        run: python -m pytest tests/harmony_release
