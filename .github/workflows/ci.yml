name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  api:
    name: API (ruff / pytest / migration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: ai_learning_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d ai_learning_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIOS_PG_TEST_URL: postgresql+asyncpg://aios:aios@localhost:5432/ai_learning_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - name: Ruff
        run: ruff check services/api
      - name: Pytest (unit + SQLite stand-in + real PG integration)
        # M8-00: DATABASE_URL 只属于 migration 步骤 —— pytest 必须验证「无 DB 503」
        # 语义，job 级 DATABASE_URL 会污染 26 个无 DB 断言（CI 失败根因）
        env:
          DATABASE_URL: ""
        run: python -m pytest services/api
      - name: Migration check (upgrade - downgrade base - upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://aios:aios@localhost:5432/ai_learning_os
        run: |
          cd services/api
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
