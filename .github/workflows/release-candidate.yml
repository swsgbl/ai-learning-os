# M10-17 本地 Release Candidate 包构建工作流（仅手动触发）。
#
# 边界（与 infra/build_release_candidate.sh 一致）：
# - 只在 workflow_dispatch 手动触发；普通 push/PR 永不触发；
# - 产出的是本地 Release Candidate——不是 production readiness 声明，
#   不授权任何部署；
# - 产物只作为 workflow artifact 上传（保留 14 天）——不创建 git tag、
#   不发布 GitHub Release、不推送镜像到任何 registry；
# - 在 GitHub 托管 runner 的本地 Docker 里构建与冒烟，不访问任何生产
#   DB/服务/主机，不读取任何真实密钥。
name: Release Candidate (manual only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（必须与 VERSION 一致，形如 vX.Y.Z；留空则取 VERSION）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-release-candidate:
    name: Build RC package (local scope, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API runtime deps (manifest helper CLI)
        run: pip install -r services/api/requirements.txt
      - name: Resolve tag from input or VERSION
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build release candidate package (images + compose smoke + archives + manifest)
        run: bash infra/build_release_candidate.sh --tag "$TAG" --output-dir "artifacts/rc-$TAG"
      - name: Independently verify package (manifest + checksums, no docker load)
        run: |
          cd services/api
          python -m app.ops.cli release-candidate verify \
            --package-dir "$GITHUB_WORKSPACE/artifacts/rc-$TAG" \
            --version-file "$GITHUB_WORKSPACE/VERSION"
      - name: Upload package as workflow artifact (NOT a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ env.TAG }}
          path: artifacts/rc-${{ env.TAG }}/
          retention-days: 14
          if-no-files-found: error
