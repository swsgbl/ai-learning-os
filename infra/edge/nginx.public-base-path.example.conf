# M14-159 公共 Web base path —— Nginx 443 location 片段模板（example）。
#
# 形态：这是 **location 片段**，不是独立 server 块。部署时 include 进
# VPS 上既有的公共 443 server（真实站点域名见 docs/PUBLIC_EDGE_DEPLOYMENT.md
# §3E——按仓库纪律，真实运营域名绝不写入本模板）：
#
#     # /etc/nginx/conf.d/<真实站点>.conf  （既有站点，勿整体替换）
#     server {
#         listen 443 ssl;
#         server_name <真实公共域名>;
#         ...既有 location /、/api/v1/、静态资源规则保持原样...
#         include /etc/nginx/aios-base-path.locations.conf;
#     }
#
# 拓扑（runbook §3E）：
#   /aios（canonical，无尾斜杠）与 /aios/...  Next（basePath=/aios 构建）
#           → frps vhost 127.0.0.1:8080，Host 改写 app.internal.aios，
#           路径原样保留交给 Next。Next 默认 trailingSlash=false：
#           /aios 直接渲染根页面，/aios/ 自身会 308 → /aios——所以边缘
#           只对斜杠形态做单向 301 归一化，canonical 入口直接代理
#           （零重定向），两个方向不互逆，Next 只被到达一次（R3 修正）；
#   /aios/health（精确，M14-161）  公共 API 健康端点 → frps vhost
#           127.0.0.1:8080，Host 改写 api.internal.aios，proxy_pass URI
#           /health（本地 API /health）：公共拓扑只转发 /aios/api/... 到
#           API，<api-origin>/health 不可达；公共 preflight 在 base path
#           拓扑探测 /aios/health，此即其 canonical 健康路由；
#   /aios/api/  FastAPI                → frps vhost 127.0.0.1:8080，
#           Host 改写 api.internal.aios，proxy_pass 带尾斜杠 URI
#           （.../api/）仅剥离 /aios 一段：/aios/api/v1/foo → /api/v1/foo；
#   /aios/download-manifest.json（精确，M14-176）+ /android/ 前缀
#           → VPS 本地静态 /var/www/aios-downloads/（同源 download
#           manifest 与已发布 APK 的公共下载面），**不经 frp 家机隧道**
#           （下载流量在边缘磁盘终结；上传/部署/验证契约见 ⑦⑧ 注释与
#           docs/PUBLIC_EDGE_DEPLOYMENT.md §3G、docs/MOBILE_DISTRIBUTION.md）；
#   /~!frp  frpc WebSocket 入口（既有行为保持） → frps 控制面 127.0.0.1:7000。
# 家机侧 frpc（frpc.windows.toml）customDomains 含同名内部 vhost
# （app.internal.aios / api.internal.aios），frps 按 Host 精确路由。
# 官方文档：https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
#
# 匹配语义（不遮蔽既有站点）：
#   - nginx 精确匹配（=）优先于一切前缀；^~ 前缀取最长者且阻止正则抢占；
#   - `= /aios` 只接无尾斜杠的裸 /aios（canonical 入口，直接代理）；
#   - `= /aios/` 只接带尾斜杠的 /aios/（301 归一化到 /aios）；
#   - `= /aios/health` 只接整串 /aios/health（M14-161 精确健康路由，
#     优先于 ^~ /aios/ 前缀；/aios/healthz、/aios/health/x、
#     /aios/api/health 等邻近 URI 一律不受影响，仍走各自最长前缀）；
#   - `^~ /aios/api/` 比 `^~ /aios/` 更长 → /aios/api/* 永远进 API 路由；
#   - `= /aios/download-manifest.json`（M14-176）只接整串清单 URI——精确
#     匹配优先于 `^~ /aios/`（否则该 URI 落进 Next 代理 404）；邻近 URI
#     （/aios/download-manifest.jsonx 等）不受影响，仍走 Web 前缀；
#   - `^~ /android/`（M14-176）根相对下载前缀：^~ 在最长前缀命中时阻止
#     宿主正则/静态 location 抢占 /android/*（普通前缀 location 会输给
#     宿主 regex，如 `~ \.apk$`）；location 内部另有 nginx 层 .apk
#     门禁——规范化 URI 不以 .apk 结尾（大小写不敏感）一律 404（⑧）；
#     反向边界——裸 /android（无尾斜杠）、/androidx 不匹配，既有站点
#     路径不受影响；
#   - `^~ /aios/` 只接 /aios/ 前缀 → /、/api/v1/ 与任何既有静态路径
#     完全不受影响（本片段除 ⑦⑧ 两个下载静态路由的 alias 外不含
#     root/try_files，也不新增正则 location）。
#
# 安全响应头（M14-163，公共浏览器面逐 location 显式）：
#   - 动机：Codex 用 M14-162 preflight 实测公共 /aios 入口（真实域名
#     见 runbook §3E，按仓库纪律不入模板）——
#     app-https FAIL（上游 Next 与边缘都未发安全响应头）。本片段在
#     ②③④⑤⑥（/aios Web canonical、斜杠归一化 redirect、公共健康、
#     API 前缀、Web 前缀）与 ⑦⑧（M14-176 下载清单 / 下载前缀，同样
#     是公共浏览器响应面）各加恒定三头：
#       Strict-Transport-Security: max-age=31536000（1 年 ≥ preflight
#         门槛 15552000；HSTS 是 host 级策略，同 host 的 Web/API 响应
#         一并覆盖）
#       X-Content-Type-Options: nosniff（API JSON/静态资源通用最佳实践）
#       Referrer-Policy: strict-origin-when-cross-origin
#   - **为什么逐 location 显式而非依赖 server 级继承**：nginx 的
#     add_header 继承规则是"location 内只要出现任何 add_header，上层
#     server 级 add_header 全部失效"；本片段 include 进任意宿主
#     server，无法假设宿主是否声明、声明了什么——显式声明使每个
#     公共响应的安全头**不依赖宿主配置**，`always` 标志保证 301/4xx
#     等非 2xx 响应同样携带（preflight 对任何状态码做判定）。
#   - ① frpc WebSocket 入口不加：那是 frpc↔frps 隧道控制面，非浏览器
#     响应面，安全头无意义。
#   - **不引入** Content-Security-Policy/X-Frame-Options 等内容策略头
#     （不放宽也不收紧——宿主站点与上游保持权威）；**不加任何
#     Access-Control-***：CORS 由家机 API 的 AIOS_CORS_ORIGINS 精确
#     allowlist 判定（runbook §8），边缘只透传、绝不代答。

# ① frpc WebSocket 入口（既有行为保持）：frpc 经 443 的 WebSocket 复用
#    到 frps 控制面（loopback 7000）。长连接要求 HTTP/1.1 + Upgrade 头
#    透传；若既有站点已有同名 location，include 本片段前先移除旧块
#    （重复声明是配置错误，nginx -t 会拒绝）。
location = /~!frp {
    proxy_pass http://127.0.0.1:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ② 裸 /aios = canonical 公共入口（无尾斜杠）→ 直接代理到 Next。R3 修正：
#    原先此处 301 → /aios/，与 Next（basePath=/aios 构建，默认
#    trailingSlash=false）对 /aios/ 的 308 → /aios 互为反向重定向，
#    构成公共重定向环（supervisor 在 aios/web:m14-159-public-edge-beta
#    镜像冒烟实证）。现在完整 URI 原样保留交给 Next（/aios 直接渲染，
#    零重定向）；Host 改写内部 vhost 名供 frps 路由到家机 Web
#    （127.0.0.1:3012，M14-157 生产 Web 回环网关）。
#    M14-163：恒定三安全头（preflight app-https 探测点——always 保证
#    任何状态码都带，逐 location 显式不依赖宿主 server 级继承）。
location = /aios {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host app.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ③ 斜杠形态 /aios/ → 301 /aios：单向归一化到 canonical 无尾斜杠入口
#    （恰好一跳；随后由 ② 直接代理，Next 只被到达一次）。相对 Location
#    由 nginx 按站点 server_name 绝对化。M14-163：301 响应同样带三
#    安全头（HSTS 在每次重定向上持续强化）。
location = /aios/ {
    return 301 /aios;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ④ 公共 API 健康端点（精确，M14-161）：整串 /aios/health 转发到 frps
#    API vhost + 本地 API /health（proxy_pass URI 显式 /health，精确
#    匹配下 nginx 用该 URI 整串替换）。动机：公共拓扑只转发 /aios/api/...
#    到 API，<api-origin>/health 不可达——公共 preflight（M14-161 起
#    支持 base path 端点）在 /aios 拓扑探测 /aios/health，此为其
#    canonical 健康路由；X-Forwarded-* 透传与 API 前缀路由一致。
#    精确匹配只接整串：不遮蔽 Web（/aios/healthz、/aios/health/x 仍走
#    ⑥）、不遮蔽 /aios/api/（/aios/api/health 仍走 ⑤）、不遮蔽既有站点。
#    M14-163：三安全头（同 host HSTS 覆盖 API 响应）；**不加任何
#    Access-Control-***——CORS 由家机 API AIOS_CORS_ORIGINS 判定。
location = /aios/health {
    proxy_pass http://127.0.0.1:8080/health;
    proxy_set_header Host api.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ⑤ AIOS API：proxy_pass 带尾斜杠 URI（http://127.0.0.1:8080/api/）——
#    nginx 用该 URI 替换被匹配的前缀 /aios/api/，恰好只剥掉 /aios 一段，
#    /aios/api/v1/foo → /api/v1/foo（查询串原样保留）。Host 改写为内部
#    vhost 名供 frps 路由到家机 API（127.0.0.1:8000）。
#    M14-163：三安全头；**不加任何 Access-Control-***（边缘零 CORS，
#    allowlist 判定权在家机 API——见 runbook §8）。
location ^~ /aios/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host api.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ⑥ AIOS Web（Next basePath=/aios 构建）：proxy_pass 不带 URI → 原样
#    保留完整 /aios/... 请求路径交给 Next。Host 改写为内部 vhost 名供
#    frps 路由到家机 Web（127.0.0.1:3012，M14-157 生产 Web 回环网关）。
#    M14-163：三安全头（页面与静态资源公共响应面）。
location ^~ /aios/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host app.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ⑦ 公共下载清单（M14-176，VPS 本地静态路由，不经 frp 家机隧道）：
#    Web 端 apps/web/src/lib/download-manifest.ts 以 basePath 前缀同源
#    取 download-manifest.json（公共拓扑即 /aios/download-manifest.json，
#    fetch no-store）——此精确路由把该 URL 终结在 VPS 本地磁盘：
#    tools/android_release/stage_download.py 产出的 <staging>/manifest.json
#    由 Codex 上传至 /var/www/aios-downloads/manifest.json（staging 形状
#    与部署目录 1:1 映射，上传/验证/回滚契约见
#    docs/PUBLIC_EDGE_DEPLOYMENT.md §3G）。精确匹配优先于 ^~ /aios/
#    （否则该 URI 落进 Next 代理 404）；types{} 清空扩展映射 +
#    default_type 兜底 = 单文件 location 内任何字节都以 application/json
#    面呈现（强制内容类型，fail-closed）；Cache-Control no-store——
#    清单是 /download 页的运行时事实来源，绝不缓存（新 APK 发布即时
#    可见）；缺文件 → 404（fail-closed，无目录语义）。M14-163 恒定
#    三安全头（公共浏览器响应面）；同源取数，无任何 Access-Control-*
#    （边缘零 CORS）。
location = /aios/download-manifest.json {
    alias /var/www/aios-downloads/manifest.json;
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ⑧ Android APK 下载前缀（M14-176，VPS 本地静态路由）：清单可信条目的
#    URL 恒为根相对 /android/<file>（无 /aios 前缀——verify_artifact 的
#    ENTRY_URL_RE 与 web 端判据同语义锁定），^~ 前缀阻止宿主正则/静态
#    location 抢占 /android/*（普通前缀会输给宿主 regex，如 ~ \.apk$）。
#    alias 终结在 VPS 本地 /var/www/aios-downloads/android/（
#    stage_download.py 的 <staging>/android/ 上传目的地）。
#    第一道门禁在 **nginx 层**（R1，Codex review）：
#    if ($uri !~* \.apk$) { return 404; }——if 内 return 是 nginx 认可
#    的安全用法（rewrite 阶段终结请求，先于静态处理器，不触碰
#    "if is evil" 的内容处理面）：规范化后的 $uri（已解码、dot-segment
#    已合并、无 query 串）不以 .apk 结尾（大小写不敏感）一律 404——
#    notes.txt/foo.apk.txt/foo.html 等杂散文件、目录 URI（含裸
#    /android/）、尾斜杠形态在进静态处理器前即被确定性拒绝，**不依赖
#    上传目录纪律**；.APK/.Apk 等大小写变体照常放行（随后静态处理器按
#    文件存在性 200/404）。注意：门禁 404 同样带 Cache-Control
#    public, max-age=3600（always 纪律），共享缓存至多负缓存一小时
#    ——对非法后缀 URL 这是永久正确的 404，无实际影响。
#    第二道纵深：显式 autoindex off + 不配 index（磁盘上意外出现的
#    目录也无列表/索引可命中）、缺文件 404；nginx 在 location 匹配前
#    已完成 URI 规范化，dot-segment/编码遍历到不了本路由。types{}
#    清空扩展映射 + default_type 强制 APK MIME——即便混入杂散文件也以
#    不可渲染的下载面呈现（三重 fail-closed）。Cache-Control public,
#    max-age=3600 有界公共缓存：文件名带版本且 stage_download.py 拒绝
#    覆盖已存在目标（URL 内容不可变），3600s 足够下载重试/断点续传，
#    又保证清单下架后最多一小时淡出共享缓存。M14-163 恒定三安全头；
#    无 proxy_*（家机不承担下载带宽）、无认证（公共匿名下载）、无任何
#    Access-Control-*（同源下载，边缘零 CORS）。
location ^~ /android/ {
    if ($uri !~* \.apk$) {
        return 404;
    }
    alias /var/www/aios-downloads/android/;
    types { }
    default_type application/vnd.android.package-archive;
    autoindex off;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
