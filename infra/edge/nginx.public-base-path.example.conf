# M14-159 公共 Web base path —— Nginx 443 location 片段模板（example）。
#
# 形态：这是 **location 片段**，不是独立 server 块。部署时 include 进
# VPS 上既有的公共 443 server（真实站点域名见 docs/PUBLIC_EDGE_DEPLOYMENT.md
# §3E——按仓库纪律，真实运营域名绝不写入本模板）：
#
#     # /etc/nginx/conf.d/<真实站点>.conf  （既有站点，勿整体替换）
#     server {
#         listen 443 ssl;
#         server_name <真实公共域名>;
#         ...既有 location /、/api/v1/、静态资源规则保持原样...
#         include /etc/nginx/aios-base-path.locations.conf;
#     }
#
# 拓扑（runbook §3E）：
#   /aios（canonical，无尾斜杠）与 /aios/...  Next（basePath=/aios 构建）
#           → frps vhost 127.0.0.1:8080，Host 改写 app.internal.aios，
#           路径原样保留交给 Next。Next 默认 trailingSlash=false：
#           /aios 直接渲染根页面，/aios/ 自身会 308 → /aios——所以边缘
#           只对斜杠形态做单向 301 归一化，canonical 入口直接代理
#           （零重定向），两个方向不互逆，Next 只被到达一次（R3 修正）；
#   /aios/api/  FastAPI                → frps vhost 127.0.0.1:8080，
#           Host 改写 api.internal.aios，proxy_pass 带尾斜杠 URI
#           （.../api/）仅剥离 /aios 一段：/aios/api/v1/foo → /api/v1/foo；
#   /~!frp  frpc WebSocket 入口（既有行为保持） → frps 控制面 127.0.0.1:7000。
# 家机侧 frpc（frpc.windows.toml）customDomains 含同名内部 vhost
# （app.internal.aios / api.internal.aios），frps 按 Host 精确路由。
# 官方文档：https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
#
# 匹配语义（不遮蔽既有站点）：
#   - nginx 精确匹配（=）优先于一切前缀；^~ 前缀取最长者且阻止正则抢占；
#   - `= /aios` 只接无尾斜杠的裸 /aios（canonical 入口，直接代理）；
#   - `= /aios/` 只接带尾斜杠的 /aios/（301 归一化到 /aios）；
#   - `^~ /aios/api/` 比 `^~ /aios/` 更长 → /aios/api/* 永远进 API 路由；
#   - `^~ /aios/` 只接 /aios/ 前缀 → /、/api/v1/ 与任何既有静态路径
#     完全不受影响（本片段不含 root/alias/try_files，也不新增正则 location）。

# ① frpc WebSocket 入口（既有行为保持）：frpc 经 443 的 WebSocket 复用
#    到 frps 控制面（loopback 7000）。长连接要求 HTTP/1.1 + Upgrade 头
#    透传；若既有站点已有同名 location，include 本片段前先移除旧块
#    （重复声明是配置错误，nginx -t 会拒绝）。
location = /~!frp {
    proxy_pass http://127.0.0.1:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ② 裸 /aios = canonical 公共入口（无尾斜杠）→ 直接代理到 Next。R3 修正：
#    原先此处 301 → /aios/，与 Next（basePath=/aios 构建，默认
#    trailingSlash=false）对 /aios/ 的 308 → /aios 互为反向重定向，
#    构成公共重定向环（supervisor 在 aios/web:m14-159-public-edge-beta
#    镜像冒烟实证）。现在完整 URI 原样保留交给 Next（/aios 直接渲染，
#    零重定向）；Host 改写内部 vhost 名供 frps 路由到家机 Web
#    （127.0.0.1:3012，M14-157 生产 Web 回环网关）。
location = /aios {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host app.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ③ 斜杠形态 /aios/ → 301 /aios：单向归一化到 canonical 无尾斜杠入口
#    （恰好一跳；随后由 ② 直接代理，Next 只被到达一次）。相对 Location
#    由 nginx 按站点 server_name 绝对化。
location = /aios/ {
    return 301 /aios;
}

# ④ AIOS API：proxy_pass 带尾斜杠 URI（http://127.0.0.1:8080/api/）——
#    nginx 用该 URI 替换被匹配的前缀 /aios/api/，恰好只剥掉 /aios 一段，
#    /aios/api/v1/foo → /api/v1/foo（查询串原样保留）。Host 改写为内部
#    vhost 名供 frps 路由到家机 API（127.0.0.1:8000）。
location ^~ /aios/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host api.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ⑤ AIOS Web（Next basePath=/aios 构建）：proxy_pass 不带 URI → 原样
#    保留完整 /aios/... 请求路径交给 Next。Host 改写为内部 vhost 名供
#    frps 路由到家机 Web（127.0.0.1:3012，M14-157 生产 Web 回环网关）。
location ^~ /aios/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host app.internal.aios;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
