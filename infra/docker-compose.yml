name: ai-learning-os

# M9-05: 所有端口默认只绑 127.0.0.1（本机使用）。
# 需要 LAN/外网访问时：AIOS_BIND_IP=0.0.0.0 且必须同时设置强 AUTH_SECRET
# 与 APP_ENV=production（API 启动 fail-closed 校验），见 docs/DEVELOPMENT.md。

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: ai_learning_os
    ports:
      # M9-07: 数据服务固定 loopback —— AIOS_BIND_IP 只影响边缘服务（api/web/livekit）
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d ai_learning_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aios
      MINIO_ROOT_PASSWORD: aios12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # M7-06: 应用回滚锚点 —— 发布时 docker tag 固化版本镜像；回滚 = AIOS_IMAGE_TAG=<旧tag> up -d --no-build
    image: aios/api:${AIOS_IMAGE_TAG:-local}
    environment:
      APP_ENV: ${AIOS_APP_ENV:-docker}
      # M9-06: 宿主绑定意图传入 API（容器内 env 名对齐 settings 字段 host_bind_ip）
      HOST_BIND_IP: ${AIOS_BIND_IP:-127.0.0.1}
      # M9-04: CORS 与 Web 端口联动 —— AIOS_WEB_PORT 自定义时默认跟随，
      # 也可用 AIOS_CORS_ORIGINS 完整覆盖（冒烟验证 preflight 一致性）
      CORS_ORIGINS: ${AIOS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:${AIOS_WEB_PORT:-3000},http://127.0.0.1:${AIOS_WEB_PORT:-3000}}
      DATABASE_URL: postgresql+asyncpg://aios:aios@postgres:5432/ai_learning_os
      REDIS_URL: redis://redis:6379/0
      # M8-00: 对象存储必配 MinIO —— 缺省回退 MemoryObjectStore 会重启丢对象
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aios-objects
      S3_ACCESS_KEY: aios
      S3_SECRET_KEY: aios12345
      LIVEKIT_URL: ws://livekit:7880
      # M9-07: LiveKit 凭据可配置 —— API 与 livekit server 经同一组变量保持一致
      LIVEKIT_API_KEY: ${AIOS_LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${AIOS_LIVEKIT_API_SECRET:-ailos-local-dev-secret-0f4c9a1e7b2d}
      # M9-01: 认证开关 —— 生产部署用部署 secret 覆盖 AUTH_SECRET；
      # 本地 dev 值仅用于开发栈（与 LIVEKIT_API_SECRET 同款占位约定）
      AUTH_SECRET: ${AIOS_AUTH_SECRET:-aios-local-dev-secret-7d21b9e4c8a3}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AIOS_AUTH_TOKEN_EXPIRE_MINUTES:-1440}
      # M7-01: profile 分离 local/hybrid/cloud —— AIOS_VOICE_MODE 插值注入语音隐私路由
      VOICE_MODE: ${AIOS_VOICE_MODE:-local}
    ports:
      - "${AIOS_BIND_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # M8-00: MinIO 未就绪就起 API，首笔上传会撞连接拒绝
      minio:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    # M9-07: --keys 与 API 共用同一组凭据变量（不再只能读仓库内占位 yaml）
    command: >-
      --config /etc/livekit/livekit.yaml
      --keys "${AIOS_LIVEKIT_API_KEY:-devkey}: ${AIOS_LIVEKIT_API_SECRET:-ailos-local-dev-secret-0f4c9a1e7b2d}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "${AIOS_BIND_IP:-127.0.0.1}:7880:7880"
      - "${AIOS_BIND_IP:-127.0.0.1}:7881:7881"
      - "${AIOS_BIND_IP:-127.0.0.1}:7882-7892:7882-7892/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # M7-01: 语音基础设施按 profile 启用 —— --profile local/hybrid/cloud 任一都含它
    profiles: ["local", "hybrid", "cloud"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # M9-07: API 地址构建期注入（局域网设备访问时需设为实际 API 地址并 rebuild）
        NEXT_PUBLIC_API_BASE_URL: ${AIOS_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    image: aios/web:${AIOS_IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      # Next standalone server.js 读 HOSTNAME 作为绑定地址；容器默认 HOSTNAME=容器 ID
      # 会绑到特定接口导致 healthcheck 127.0.0.1 拒连 —— 显式绑全接口
      HOSTNAME: 0.0.0.0
    ports:
      - "${AIOS_BIND_IP:-127.0.0.1}:${AIOS_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
