name: ai-learning-os

# M9-05: 所有端口默认只绑 127.0.0.1（本机使用）。
# 需要 LAN/外网访问时：AIOS_BIND_IP=0.0.0.0 且必须同时设置强 AUTH_SECRET
# 与 APP_ENV=production（API 启动 fail-closed 校验），见 docs/DEVELOPMENT.md。
#
# M14-37: LiveKit 媒体面可独立绑定 —— AIOS_LIVEKIT_BIND_IP 单独把 livekit
# 绑到 LAN IP（回落链 AIOS_LIVEKIT_BIND_IP → AIOS_BIND_IP → 127.0.0.1），
# 解决默认浏览器连本机 loopback LiveKit 的间歇性 ICE 失败（M14-35 生产阻塞），
# 无需为此把 API/Web 一起暴露。API/Web 仍走 AIOS_BIND_IP；LiveKit 单独非
# loopback 绑定时 API 启动 fail-closed 要求强 LIVEKIT_API_SECRET 与可达
# PUBLIC_LIVEKIT_URL（本机同机场景 API 保持 loopback，CORS/APP_ENV 不动）。

# M14-06: 全部长驻服务 restart: unless-stopped —— Docker 引擎重启/容器崩溃后
# 自动拉起（自愈基线）；显式 `docker compose stop/down` 仍会被尊重（unless-
# stopped 语义）。恢复编排（tools/ops/production_recovery.py）负责引擎等待与
# 幂等 up -d --no-build；本策略是容器面兜底。已存在的容器需一次 up -d 重建
# 才能获得该策略（compose 首次应用时的预期行为）。

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: ai_learning_os
    ports:
      # M9-07: 数据服务固定 loopback —— AIOS_BIND_IP 只影响边缘服务（api/web/livekit）
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d ai_learning_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # M14-13 CI R2: MinIO 社区版自 2025-10 起停止分发官方 Docker 镜像
    # （source-only 分发），minio/minio:latest 拉取使 Docker CI 在项目构建前即
    # 失败。改为本地自建官方源码（infra/minio/Dockerfile）：上游 tag+commit 与
    # builder/runtime 基镜像 digest 全部 pin（supervisor 核验），供应链
    # rationale/pins/limitations/长期替代见 docs/evidence/m14-13-minio-selfbuild/。
    # 服务接口（名称/端口/env/卷/restart）保持不变；生产已有 root 属主卷的
    # 一次性迁移在采纳时由 supervisor 执行（README 采纳注记）。
    build:
      context: ./minio
    # 自建镜像锚点（与 api/web 同款回滚约定）——tag 即上游 RELEASE，升版 =
    # 显式改此 tag + Dockerfile ARG（无浮动 tag 漂移面）
    image: aios/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aios
      MINIO_ROOT_PASSWORD: aios12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # 自建 runtime 只含 minio 二进制（无 mc）——用 Alpine 自带 BusyBox wget
      # 探官方就绪端点 /minio/health/cluster（`mc ready` 消费的同一信号源；
      # 与 web/livekit 健康检查同款命令面）
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/cluster || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # M7-06: 应用回滚锚点 —— 发布时 docker tag 固化版本镜像；回滚 = AIOS_IMAGE_TAG=<旧tag> up -d --no-build
    image: aios/api:${AIOS_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      APP_ENV: ${AIOS_APP_ENV:-docker}
      # M9-06: 宿主绑定意图传入 API（容器内 env 名对齐 settings 字段 host_bind_ip）
      HOST_BIND_IP: ${AIOS_BIND_IP:-127.0.0.1}
      # M14-37: LiveKit 媒体面独立绑定意图传入 API（对齐 settings
      # host_livekit_bind_ip）—— 非 loopback 时启动校验要求强
      # LIVEKIT_API_SECRET + 可达 PUBLIC_LIVEKIT_URL（fail-closed）
      HOST_LIVEKIT_BIND_IP: ${AIOS_LIVEKIT_BIND_IP:-}
      # M9-04: CORS 与 Web 端口联动 —— AIOS_WEB_PORT 自定义时默认跟随，
      # 也可用 AIOS_CORS_ORIGINS 完整覆盖（冒烟验证 preflight 一致性）
      CORS_ORIGINS: ${AIOS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:${AIOS_WEB_PORT:-3000},http://127.0.0.1:${AIOS_WEB_PORT:-3000}}
      DATABASE_URL: postgresql+asyncpg://aios:aios@postgres:5432/ai_learning_os
      REDIS_URL: redis://redis:6379/0
      # M8-00: 对象存储必配 MinIO —— 缺省回退 MemoryObjectStore 会重启丢对象
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aios-objects
      S3_ACCESS_KEY: aios
      S3_SECRET_KEY: aios12345
      # M9-08: 浏览器可达 LiveKit 地址 —— 公开模式必配（AIOS_BIND_IP 非 loopback
      # 时 fail-closed 校验）；本机模式留空则 token 回退 127.0.0.1
      # M9-08: LIVEKIT_URL 是浏览器可达地址（token ws_url）—— 本机默认 127.0.0.1；
      # 容器内部地址 ws://livekit:7880 只服务端调用用，绝不发给浏览器
      LIVEKIT_URL: ${AIOS_LIVEKIT_URL:-ws://127.0.0.1:7880}
      # M9-08: 浏览器可达 LiveKit 地址 —— 公开模式必配（AIOS_BIND_IP 非 loopback
      # 时 fail-closed 校验）；本机模式留空则 token 回退 127.0.0.1
      PUBLIC_LIVEKIT_URL: ${AIOS_PUBLIC_LIVEKIT_URL:-}
      # M9-07: LiveKit 凭据可配置 —— API 与 livekit server 经同一组变量保持一致
      LIVEKIT_API_KEY: ${AIOS_LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${AIOS_LIVEKIT_API_SECRET:-ailos-local-dev-secret-0f4c9a1e7b2d}
      # M9-01: 认证开关 —— 生产部署用部署 secret 覆盖 AUTH_SECRET；
      # 本地 dev 值仅用于开发栈（与 LIVEKIT_API_SECRET 同款占位约定）
      AUTH_SECRET: ${AIOS_AUTH_SECRET:-aios-local-dev-secret-7d21b9e4c8a3}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AIOS_AUTH_TOKEN_EXPIRE_MINUTES:-1440}
      # M10-03: Web 登录态 HttpOnly cookie；HTTPS 反代部署设置
      # AIOS_AUTH_COOKIE_SECURE=true（SameSite=None 时强制 Secure）
      AUTH_COOKIE_SECURE: ${AIOS_AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AIOS_AUTH_COOKIE_SAMESITE:-lax}
      # M7-01: profile 分离 local/hybrid/cloud —— AIOS_VOICE_MODE 插值注入语音隐私路由
      VOICE_MODE: ${AIOS_VOICE_MODE:-local}
      # M14-01: 本地真实语音引擎槽位（引擎部署在宿主 WSL，恒绑 WSL 127.0.0.1；
      # 容器经 host.docker.internal 访问——形如 AIOS_ASR_LOCAL_ENDPOINT=
      # http://host.docker.internal:8010/v1。endpoint 留空 = 降级 fake/tone 并透出
      # fallback；配好但不可达 = fail visibly（providers 视图仍报 local-*，请求 502
      # 固定脱敏文案，绝不静默换替身）。key 只经部署 secret 注入，不入库）
      ASR_LOCAL_ENDPOINT: ${AIOS_ASR_LOCAL_ENDPOINT:-}
      ASR_LOCAL_MODEL: ${AIOS_ASR_LOCAL_MODEL:-sensevoice}
      ASR_LOCAL_API_KEY: ${AIOS_ASR_LOCAL_API_KEY:-}
      TTS_LOCAL_ENDPOINT: ${AIOS_TTS_LOCAL_ENDPOINT:-}
      TTS_LOCAL_MODEL: ${AIOS_TTS_LOCAL_MODEL:-Fun-CosyVoice3-0.5B-2512}
      TTS_LOCAL_API_KEY: ${AIOS_TTS_LOCAL_API_KEY:-}
      # M14-64: cloud/search/LLM provider 与隐私路由配置透传（对齐
      # services/api/app/core/config.py Settings 槽位；容器内变量名 = 字段
      # 大写）。默认渲染与应用默认严格一致：不启用云端能力、不含任何真实
      # key/endpoint/model——部署时经 AIOS_* 部署变量显式注入（真实凭据只放
      # 部署 secret/.env，不入库不入码；infra/smoke_llm.sh / smoke_search.sh /
      # smoke_voice_cloud.sh 真实端点冒烟通过后注入生效）。
      MODEL_ROUTE: ${AIOS_MODEL_ROUTE:-hybrid}
      SEARCH_MODE: ${AIOS_SEARCH_MODE:-local}
      PRIVACY_STORE_AUDIO: ${AIOS_PRIVACY_STORE_AUDIO:-false}
      PRIVACY_SEND_CONTEXT_TO_CLOUD: ${AIOS_PRIVACY_SEND_CONTEXT_TO_CLOUD:-true}
      # M14-64: 显式 provider selector（routing.py：覆盖 VOICE_MODE 默认选择；
      # PRIVACY.md 同款语义）。默认空 = 不覆盖，按模式路由
      ASR_PROVIDER: ${AIOS_ASR_PROVIDER:-}
      TTS_PROVIDER: ${AIOS_TTS_PROVIDER:-}
      # M4-02 云端语音槽位（OpenAI 兼容端点）：endpoint/key 默认空
      ASR_CLOUD_ENDPOINT: ${AIOS_ASR_CLOUD_ENDPOINT:-}
      ASR_CLOUD_API_KEY: ${AIOS_ASR_CLOUD_API_KEY:-}
      ASR_CLOUD_MODEL: ${AIOS_ASR_CLOUD_MODEL:-whisper-1}
      TTS_CLOUD_ENDPOINT: ${AIOS_TTS_CLOUD_ENDPOINT:-}
      TTS_CLOUD_API_KEY: ${AIOS_TTS_CLOUD_API_KEY:-}
      TTS_CLOUD_MODEL: ${AIOS_TTS_CLOUD_MODEL:-tts-1}
      # M14-65 云端 TTS 音色（/audio/speech 请求体 voice 字段）：默认 tongtong
      # （BigModel 官方 glm-tts 预置音色）；`:-` 语义与 TTS_CLOUD_MODEL 一致——
      # 未设或置空均回落默认
      TTS_CLOUD_VOICE: ${AIOS_TTS_CLOUD_VOICE:-tongtong}
      # M10-01 LLM 槽位（OpenAI 兼容端点）：全部默认空 = 未配置云端 LLM
      LLM_PROVIDER: ${AIOS_LLM_PROVIDER:-}
      LLM_ENDPOINT: ${AIOS_LLM_ENDPOINT:-}
      LLM_API_KEY: ${AIOS_LLM_API_KEY:-}
      LLM_MODEL: ${AIOS_LLM_MODEL:-}
      # M14-70 主观题判分 judge selector（config.py rubric_judge 槽位）：默认
      # keyword = 内置确定性 judge，与应用默认严格一致；AIOS_RUBRIC_JUDGE=llm
      # 显式切换 LLM judge（复用上方 LLM_* 槽位）。`:-` 语义与 TTS_CLOUD_VOICE
      # 一致——未设或置空均回落默认
      RUBRIC_JUDGE: ${AIOS_RUBRIC_JUDGE:-keyword}
      # 部署 runbook 与 LLM_PROVIDER 并列的 embedding selector：默认空
      EMBEDDING_PROVIDER: ${AIOS_EMBEDDING_PROVIDER:-}
      # M5-01 cloud-web 搜索槽位：全部默认空 = 未配置云端搜索。
      # M14-66: 本地 SearXNG 栈（searxng 服务，--profile search 启用）的
      # compose 网络内端点是 http://searxng:8080——显式注入
      # AIOS_SEARCH_MODE=cloud + AIOS_SEARCH_CLOUD_ENDPOINT=http://searxng:8080
      # 后 cloud-web 才出站（providers.py 三门判定缺一 fail-closed，默认
      # 渲染零变化，非搜索路径不隐式启用 context 出站）
      SEARCH_PROVIDER: ${AIOS_SEARCH_PROVIDER:-}
      SEARCH_CLOUD_ENDPOINT: ${AIOS_SEARCH_CLOUD_ENDPOINT:-}
      SEARCH_CLOUD_API_KEY: ${AIOS_SEARCH_CLOUD_API_KEY:-}
    # M14-01: Linux 引擎上 host.docker.internal 需显式 host-gateway 映射
    # （Docker Desktop 自带；此行使 compose 在两类引擎上行为一致，不暴露引擎端口）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AIOS_BIND_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # M8-00: MinIO 未就绪就起 API，首笔上传会撞连接拒绝
      minio:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # M9-07/M9-08: --keys 与 API 共用同一组凭据；config 可切换 local/public
    # （AIOS_LIVEKIT_CONFIG，public 版 use_external_ip=true 适合公网自动探测）；
    # --node-ip 显式通告媒体地址：AIOS_LIVEKIT_EXTERNAL_IP 显式优先（M9-08
    # 局域网语义保留），回落 AIOS_LIVEKIT_BIND_IP（M14-37：单变量路径下
    # 绑定与通告同一 LAN IP 自洽），本机默认 127.0.0.1
    command: >-
      --config ${AIOS_LIVEKIT_CONFIG:-/etc/livekit/livekit.yaml}
      --keys "${AIOS_LIVEKIT_API_KEY:-devkey}: ${AIOS_LIVEKIT_API_SECRET:-ailos-local-dev-secret-0f4c9a1e7b2d}"
      --node-ip "${AIOS_LIVEKIT_EXTERNAL_IP:-${AIOS_LIVEKIT_BIND_IP:-127.0.0.1}}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ./livekit/livekit-public.yaml:/etc/livekit/livekit-public.yaml:ro
    ports:
      # M14-37: 媒体面独立绑定回落链（LiveKit 可单独 LAN，API/Web 不动）
      - "${AIOS_LIVEKIT_BIND_IP:-${AIOS_BIND_IP:-127.0.0.1}}:7880:7880"
      - "${AIOS_LIVEKIT_BIND_IP:-${AIOS_BIND_IP:-127.0.0.1}}:7881:7881"
      - "${AIOS_LIVEKIT_BIND_IP:-${AIOS_BIND_IP:-127.0.0.1}}:7882-7892:7882-7892/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # M7-01: 语音基础设施按 profile 启用 —— --profile local/hybrid/cloud 任一都含它
    profiles: ["local", "hybrid", "cloud"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # M9-07: API 地址构建期注入（局域网设备访问时需设为实际 API 地址并 rebuild）
        NEXT_PUBLIC_API_BASE_URL: ${AIOS_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    # M14-09: Web 镜像 tag 独立锚点 —— 只读 AIOS_WEB_IMAGE_TAG（默认 local），
    # 不再跟随 AIOS_IMAGE_TAG（避免 Web-only 升级时混用两代镜像或破坏 recovery
    # pin）。只设 AIOS_IMAGE_TAG 不会改变 Web tag（compose config 可见）；
    # 同 tag 发布/回滚 = 显式同时设置 AIOS_IMAGE_TAG 与 AIOS_WEB_IMAGE_TAG。
    image: aios/web:${AIOS_WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Next standalone server.js 读 HOSTNAME 作为绑定地址；容器默认 HOSTNAME=容器 ID
      # 会绑到特定接口导致 healthcheck 127.0.0.1 拒连 —— 显式绑全接口
      HOSTNAME: 0.0.0.0
    ports:
      - "${AIOS_BIND_IP:-127.0.0.1}:${AIOS_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  searxng:
    # M14-66: 本地 SearXNG 元搜索（cloud-web 搜索源的自托管后端）。官方镜像
    # digest pin（supervisor 核验）——不可变供应链锚点，升级 = 显式改 digest。
    # 容器端口保持官方 8080；宿主 8878（8080 已被本机无关进程占用，绝不映射）。
    # API 侧不经宿主端口访问——compose 网络内用 http://searxng:8080（见 api
    # 服务 SEARCH_CLOUD_ENDPOINT 注释的显式接线配方）。
    # 详见 docs/evidence/m14-66-searxng-local-provider/
    image: docker.io/searxng/searxng@sha256:6869f20676fd91e3f856bcaefc510bc363fdd126f7bd860f49f2ffcb3b305da0
    restart: unless-stopped
    environment:
      # 生产 secret 注入路径：AIOS_SEARXNG_SECRET 优先，回落通用
      # SEARXNG_SECRET，均未设 = dev 占位（与 ./searxng/settings.yml 的
      # server.secret_key 回退同一字面量，静态测试锁两处一致防漂移）。
      # 镜像在加载期以 SEARXNG_SECRET 覆盖 server.secret_key（与 :ro
      # 挂载兼容）；真实 secret 只放部署 secret/.env，不入库
      SEARXNG_SECRET: ${AIOS_SEARXNG_SECRET:-${SEARXNG_SECRET:-aios-searxng-local-secret-8e4b2c91d7f3}}
      # M14-66 出站代理显式控制（可选）：受管网络直连上游引擎超时的部署，
      # 经部署 env 注入 AIOS_SEARXNG_HTTP_PROXY / AIOS_SEARXNG_HTTPS_PROXY
      # / AIOS_SEARXNG_NO_PROXY——compose 不硬编码任何代理地址/端口（静态
      # 与渲染测试双锁），默认恒空 = 直连出站（空值被 urllib getproxies 忽略
      # ，不产生代理行为）。刻意不设通用 HTTP_PROXY 回落链：代理启用恒为
      # 部署显式行为，绝不隐式继承宿主 shell 的通用代理 env。仅大写单形：
      # SearXNG 出站栈 httpx 经 urllib getproxies 大小写不敏感读取，单形即
      # 全量生效；不镜像小写双形（徒增漂移面，且只读小写的客户端会把容器
      # 内回环健康检查送进代理）。NO_PROXY 同链显式透传（不经代理的目标）
      HTTP_PROXY: ${AIOS_SEARXNG_HTTP_PROXY:-}
      HTTPS_PROXY: ${AIOS_SEARXNG_HTTPS_PROXY:-}
      NO_PROXY: ${AIOS_SEARXNG_NO_PROXY:-}
    volumes:
      # 仓库受控配置只读挂载（formats html+json / limiter false / 私有实例）
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # 命名缓存卷：容器重建/镜像升级不丢搜索缓存
      - searxng-cache:/var/cache/searxng
    ports:
      # 恒绑 loopback：仅本机使用，绝不暴露 LAN/外网（与数据服务同款边界；
      # AIOS_BIND_IP 边缘绑定语义不适用于本服务——搜索栈无 LAN 暴露需求）
      - "127.0.0.1:8878:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 显式部署控制：仅 --profile search 启动（搜索是显式启用的出站能力，
    # 不随基础栈隐式拉起；不挂 local/hybrid/cloud 语音 profile——语音模式
    # 与搜索模式是两独立开关，互不隐含）
    profiles: ["search"]

volumes:
  postgres-data:
  minio-data:
  searxng-cache:
